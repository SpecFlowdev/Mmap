# Имена файлов не версионируются, поэтому разметку, стили и скрипты браузер
# каждый раз перепроверяет по ETag: после пересборки образа приходит новая
# версия, а не старая из кэша (проверка дешёвая — 304 без тела).
# Шрифты неизменны, их держим в кэше долго.
map $uri $mmap_cache {
    default                "no-cache";
    "~^/assets/fonts/"     "public, max-age=2592000";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Заголовки задаются один раз на уровне сервера: add_header внутри location
    # отменил бы унаследованные, включая заголовки безопасности.
    add_header Cache-Control $mmap_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;
}
